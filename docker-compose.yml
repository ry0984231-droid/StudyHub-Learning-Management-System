services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: studyhub
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/studyhub
      MONGODB_DB_NAME: studyhub
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: .
      target: build
    command: ["npm", "run", "dev:frontend", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://app:5000
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  mongo-data:
  uploads-data:
